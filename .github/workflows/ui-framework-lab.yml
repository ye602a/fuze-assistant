name: UI framework prototype
on:
  pull_request:
    branches: [master, feat/rust-v063-parity, feat/rust-ui-framework-lab, feat/slint-performance-validation, feat/slint-v063-restoration, feat/slint-host-interactions, feat/slint-live-overlays, feat/slint-startup-maintenance, feat/slint-history-actions, feat/slint-champion-records, feat/slint-observation-overlay, feat/slint-runtime-closure, feat/slint-renderer-recovery, feat/rust-update-transfer-status, feat/rust-locale-activation, fix/rust-locale-context, test/rust-private-transfer, perf/rust-update-range-routing, feat/rust-update-resume]
    paths:
      - 'rust/ui-lab/**'
      - 'rust/crates/**'
      - 'scripts/create-ui-host-fixture.mjs'
      - 'scripts/package-rust-preview.mjs'
      - 'scripts/package-rust-update.mjs'
      - 'scripts/check-rust-desktop.mjs'
      - 'scripts/check-rust-private-transfer.mjs'
      - 'public/fuze.png'
      - '.github/workflows/ui-framework-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-framework-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Development batch requested compile/privacy checks only. Full workflow_dispatch remains available.
  windows-compile:
    if: github.event_name == 'pull_request' && (github.base_ref == 'feat/slint-history-actions' || github.base_ref == 'feat/slint-champion-records')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked privacy boundary
        run: node scripts/check-secrets.mjs
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - uses: actions/cache@v4
        with:
          path: rust/ui-lab/target
          key: ui-check-win-1.90-${{ hashFiles('rust/ui-lab/Cargo.lock') }}
      - name: Format and compile only
        working-directory: rust/ui-lab
        run: |
          cargo +1.90.0 fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 check --locked --features gpu -j 2
          exit $LASTEXITCODE
  windows-prototype:
    if: github.event_name != 'pull_request' || (github.base_ref != 'feat/slint-history-actions' && github.base_ref != 'feat/slint-champion-records' && github.base_ref != 'feat/slint-renderer-recovery' && github.base_ref != 'feat/rust-update-transfer-status' && github.base_ref != 'feat/rust-locale-activation' && github.base_ref != 'fix/rust-locale-context' && github.base_ref != 'test/rust-private-transfer' && github.base_ref != 'perf/rust-update-range-routing' && github.base_ref != 'feat/rust-update-resume')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked privacy boundary
        run: node scripts/check-secrets.mjs
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - uses: actions/cache@v4
        with:
          path: rust/ui-lab/target
          key: ui-lab-win-1.90-${{ hashFiles('rust/ui-lab/Cargo.lock') }}
          restore-keys: ui-lab-win-1.90-
      - name: Format and build software and Skia entry points
        working-directory: rust/ui-lab
        run: |
          cargo +1.90.0 fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 build --release --locked --features gpu -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 test --release --locked --features gpu -j 2 status_view::tests
          exit $LASTEXITCODE
      - name: Offscreen images and hidden own-window invariants
        working-directory: rust/ui-lab
        run: |
          ./target/release/fuze-ui-lab.exe --review artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-native software artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-native skia-software artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-skia-surface software artifacts
          exit $LASTEXITCODE
      # No installers, upload-artifact, release publication or game/LCU access.
      - name: Managed frontend selection compatibility
        working-directory: rust/ui-lab
        run: cargo +1.90.0 test --manifest-path ../Cargo.toml --target-dir target -p fuze-worker-host --lib frontend_selection_preserves_legacy_and_rejects_unknown_or_missing --locked -j 2
      - name: Windowless cancellation and context gate
        working-directory: rust/ui-lab
        run: cargo +1.90.0 test --manifest-path ../Cargo.toml --target-dir target -p fuze-native-overlay --lib headless_gate_cancels_without_window_thread_or_ack --locked -j 2
      - name: Existing Rust services through hidden Slint callbacks
        working-directory: rust/ui-lab
        run: |
          node ../../scripts/create-ui-host-fixture.mjs artifacts/host-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-host artifacts/host-data artifacts/host-review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --desktop-smoke artifacts/host-data/preview.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-recovery artifacts/host-data/preview.json artifacts/renderer-recovery
          exit $LASTEXITCODE
      - name: Selective history import boundary
        working-directory: rust/ui-lab
        run: cargo +1.90.0 test --manifest-path ../Cargo.toml --target-dir target -p fuze-worker-host --lib selective_preview_never_adds_unreviewed_matches_or_claims --locked -j 2

  windows-update:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/slint-renderer-recovery' || github.base_ref == 'fix/rust-locale-context' || github.base_ref == 'test/rust-private-transfer' || github.base_ref == 'perf/rust-update-range-routing' || github.base_ref == 'feat/rust-update-resume'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked privacy boundary
        run: node scripts/check-secrets.mjs
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - uses: actions/cache@v4
        with:
          path: rust/target
          key: update-check-win-1.90-${{ hashFiles('rust/Cargo.lock') }}
      - name: Transfer boundaries, native text and updater build
        working-directory: rust
        run: |
          cargo +1.90.0 fmt -p fuze-worker-host -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 test -p fuze-worker-host --lib update_ --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 test -p fuze-worker-host --lib i18n::tests --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 build -p fuze-worker-host --bin fuze-update --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 build -p fuze-worker-host --bin fuze-update-verify --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ../scripts/check-rust-private-transfer.mjs
          exit $LASTEXITCODE

  windows-locale:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'feat/rust-update-transfer-status' || github.base_ref == 'feat/rust-locale-activation'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked privacy boundary
        run: node scripts/check-secrets.mjs
      - name: Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - uses: actions/cache@v4
        with:
          path: rust/target
          key: locale-check-win-1.90-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: update-check-win-1.90-
      - name: Locale activation, rollback and host integration
        working-directory: rust
        run: |
          cargo +1.90.0 fmt -p fuze-worker-host -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 test -p fuze-worker-host --lib locale_ --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 test -p fuze-worker-host --lib preferences::tests --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 check -p fuze-worker-host --bins --locked -j 2
          exit $LASTEXITCODE
      - uses: actions/cache@v4
        if: github.base_ref == 'feat/rust-locale-activation'
        with:
          path: rust/ui-lab/target
          key: ui-lab-win-1.90-${{ hashFiles('rust/ui-lab/Cargo.lock') }}
          restore-keys: ui-lab-win-1.90-
      - name: Hidden Slint host and observation identity transitions
        if: github.base_ref == 'feat/rust-locale-activation'
        working-directory: rust/ui-lab
        run: |
          cargo +1.90.0 fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 build --release --locked --features gpu -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../scripts/create-ui-host-fixture.mjs artifacts/host-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/fuze-ui-lab.exe --review-host artifacts/host-data artifacts/host-review
          exit $LASTEXITCODE
