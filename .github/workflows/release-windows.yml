name: FUZE source checks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Keep the existing required-check context; this job no longer builds Electron.
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:check
      - run: npm test
