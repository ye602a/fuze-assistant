name: Rust isolated prototypes
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'resources/paddleocr/**'
      - 'tests/fixtures/augment-ocr/**'
      - 'scripts/check-secrets.mjs'
      - '.gitignore'
      - 'scripts/package-rust-preview.mjs'
      - 'scripts/package-rust-update.mjs'
      - 'scripts/rust-bundle-policy.mjs'
      - 'scripts/rust-runtime-contract.mjs'
      - 'scripts/build-rust-with-evidence.ps1'
      - 'scripts/install-rust-prerequisites.ps1'
      - 'tests/unit/rust-runtime-contract.test.mjs'
      - 'tests/unit/rust-runtime-bootstrap.ps1'
      - 'tests/unit/rust-bundle-policy.test.mjs'
      - 'scripts/check-rust-update.mjs'
      - 'scripts/check-rust-desktop.mjs'
      - 'scripts/prepare-rust-data.mjs'
      - 'scripts/check-rust-prototypes.mjs'
      - 'scripts/rust-prototype-tools.mjs'
      - 'scripts/compare-rust-ocr.mjs'
      - 'scripts/benchmark-rust-node.mjs'
      - 'scripts/test-rust-host.mjs'
      - 'scripts/check-rust-capture.mjs'
      - 'scripts/check-rust-pipeline.mjs'
      - 'scripts/check-rust-worker.mjs'
      - 'scripts/compare-rust-shapes.mjs'
      - 'scripts/actions-validation-summary.mjs'
      - 'tests/unit/actions-validation-summary.test.mjs'
      - '!rust/**/*.md'
      - '.github/workflows/rust-prototypes.yml'
  workflow_dispatch:
    inputs:
      stage_acceptance:
        description: '阶段版本验收：生成测试包和更新包，验证安装回滚与完整桌面'
        type: boolean
        default: false
      artifacts:
        description: '阶段验收附件：none 不保留，preview 测试 ZIP，full 含更新包和诊断工具'
        type: choice
        default: none
        options: [none, preview, full]
      ui_frontend:
        description: '阶段测试界面：Slint 为当前中文版；Win32 仅保留旧实现对照'
        type: choice
        default: slint
        options: [slint, win32]
permissions:
  contents: read
concurrency:
  group: rust-prototypes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototypes:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify no private runtime data or secrets are tracked
        id: secrets
        run: node scripts/check-secrets.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install existing runtime dependency for offline ONNX fixtures
        run: npm ci --ignore-scripts
      - name: Prepare Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Reuse Rust build dependencies
        uses: actions/cache@v4
        with:
          path: rust/target
          key: rust-windows-1.90-v1-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-windows-1.90-v1-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Format, contracts and build
        id: build
        working-directory: rust
        run: |
          cargo +1.90.0 fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $env:FUZE_SHARE_FIXTURE = Join-Path (Get-Location) 'artifacts/share.png'
          cargo +1.90.0 test --workspace --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.90.0 build --workspace --release --locked -j 2
          exit $LASTEXITCODE
      - name: Offline ONNX and hidden native window
        id: ocr
        run: node scripts/check-rust-prototypes.mjs
      - name: Persistent worker, raw atlas IPC and bounded lifecycle
        id: worker
        env:
          FUZE_RUST_CI_VISIBLE: '1'
        run: node scripts/check-rust-worker.mjs
      - name: Native capture boundary and generated GPU ROI readback
        id: capture
        run: node scripts/check-rust-capture.mjs
      - name: Native atlas to OCR and own-window capture lifecycle
        id: pipeline
        env:
          FUZE_RUST_CI_VISIBLE: '1'
        run: node scripts/check-rust-pipeline.mjs
      - name: Same-input CPU comparison and automatic fallback
        id: fallback
        run: |
          node --test scripts/test-rust-host.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/compare-rust-ocr.mjs
          exit $LASTEXITCODE
      - name: Validate workflow policy and data preparation contracts
        id: contracts
        run: |
          node --test tests/unit/actions-validation-summary.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/unit/rust-data-preparation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/unit/rust-feedback-export.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/unit/rust-bundle-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/unit/rust-runtime-contract.test.mjs
          exit $LASTEXITCODE
      - name: Build milestone binaries with toolchain and runtime evidence
        id: frontend
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance
        env:
          FUZE_UI_FRONTEND: ${{ inputs.ui_frontend }}
        run: |
          ./scripts/build-rust-with-evidence.ps1 -Frontend $env:FUZE_UI_FRONTEND
          exit $LASTEXITCODE
      - name: Assemble and self-check milestone Rust preview
        id: package
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance
        env:
          FUZE_UI_FRONTEND: ${{ inputs.ui_frontend }}
        run: |
          node scripts/prepare-rust-data.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-rust-preview.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-rust-update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-rust-update.mjs
          exit $LASTEXITCODE
      - name: Native desktop pause and exit (own window only)
        id: desktop
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance
        env:
          FUZE_RUST_CI_TRAY: '1'
        run: node scripts/check-rust-desktop.mjs
      - name: Scan upload content
        id: upload_scan
        run: npm run security:check
      - name: Upload requested preview ZIP (not a stable installer)
        id: upload_preview
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance && inputs.artifacts != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: rust-development-preview
          path: |
            rust/artifacts/preview/*.zip
            rust/artifacts/preview/*.sha256
          retention-days: 3
      - name: Upload requested native update bundle
        id: upload_update
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance && inputs.artifacts == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: rust-update-bundle
          path: |
            rust/artifacts/preview/*.fuz
            rust/artifacts/preview/*.blockmap
            rust/artifacts/preview/rust-update.json
          retention-days: 3
      - name: Upload sanitized prototype reports
        id: upload_evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.stage_acceptance && inputs.artifacts == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: rust-prototype-evidence
          retention-days: 7
          path: |
            rust/artifacts/desktop-validation.json
            rust/artifacts/update-validation.json
            rust/artifacts/desktop.png
            rust/artifacts/champion-select.png
            rust/artifacts/popup-review/interaction-checks.json
            rust/artifacts/popup-review/champion-description.png
            rust/artifacts/popup-review/champion-build.png
            rust/artifacts/augment-reference.png
            rust/artifacts/share.png
            rust/artifacts/share-icons-zh-CN.png
            rust/artifacts/share-icons-zh-TW.png
            rust/artifacts/share-icons-en-US.png
            rust/artifacts/desktop-en-US-augments.png
            rust/artifacts/desktop-zh-TW-augments.png
            rust/artifacts/stage-reference.png
            rust/artifacts/desktop-en-US-stages.png
            rust/artifacts/desktop-zh-TW-stages.png
            rust/artifacts/settings.png
            rust/artifacts/preview-validation.json
            rust/artifacts/validation.json
            rust/artifacts/native-overlay.png
            rust/artifacts/native-overlay-retained.png
            rust/artifacts/comparison.json
            rust/artifacts/capture-validation.json
            rust/artifacts/pipeline-validation.json
            rust/artifacts/worker-validation.json
          if-no-files-found: ignore
      - name: Prepare isolated prototype executables
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance && inputs.artifacts == 'full'
        run: |
          New-Item -ItemType Directory -Force rust/artifacts/tools | Out-Null
          Copy-Item rust/target/release/fuze-ocr.exe,rust/target/release/fuze-ocr-worker.exe,rust/target/release/fuze-worker-host.exe,rust/target/release/fuze-rust-host.exe,rust/target/release/fuze-native-overlay.exe,rust/target/release/fuze-capture.exe rust/artifacts/tools/
          Get-ChildItem rust/artifacts/tools/*.exe | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii rust/artifacts/tools/SHA256SUMS.txt
      - name: Upload isolated test tools (not a release installer)
        id: upload_tools
        if: github.event_name == 'workflow_dispatch' && inputs.stage_acceptance && inputs.artifacts == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: rust-prototype-tools
          path: rust/artifacts/tools/
          retention-days: 3
      - name: Keep validation results in the job summary
        if: always()
        env:
          FUZE_CI_KIND: rust
          FUZE_CI_STATUS: ${{ job.status }}
          FUZE_CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/actions-validation-summary.mjs
