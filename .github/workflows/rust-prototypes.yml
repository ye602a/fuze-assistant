name: Build FUZE 0.7.5 preview
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fuze-preview-publication
  cancel-in-progress: false
env:
  SOURCE_SHA: 33bb6176e46af8f13a517ee224ffac13f6c787c3
  FUZE_UI_FRONTEND: slint
  PACKAGING_SHA: 370953ca21a065cc25370fb31a97df7a7edc3b65
jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preserve release helpers outside the clean source checkout
        shell: pwsh
        run: Copy-Item .release-helpers (Join-Path $env:RUNNER_TEMP "fuze-release-helpers") -Recurse
      - uses: actions/checkout@v4
        with:
          ref: 33bb6176e46af8f13a517ee224ffac13f6c787c3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install existing build dependencies
        run: npm ci --ignore-scripts
      - name: Seed build data from the verified public package
        run: node (Join-Path $env:RUNNER_TEMP 'fuze-release-helpers/seed-public-data.mjs')
      - name: Prepare Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: rust/target
          key: rust-preview-1.90-${{ hashFiles('rust/Cargo.lock', 'rust/ui-lab/Cargo.lock', 'rust/vc-runtime-policy.json') }}-${{ env.SOURCE_SHA }}
          restore-keys: rust-preview-1.90-${{ hashFiles('rust/Cargo.lock', 'rust/ui-lab/Cargo.lock', 'rust/vc-runtime-policy.json') }}-
      - uses: actions/download-artifact@v4
        with:
          name: preview-build-evidence
          run-id: 40199537921
          github-token: ${{ github.token }}
          path: rust
      - name: Verify original binaries and apply packaging-only correction
        shell: pwsh
        run: |
          git fetch origin $env:PACKAGING_SHA --depth=2
          $changed = @(git diff --name-only $env:SOURCE_SHA $env:PACKAGING_SHA)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'scripts/bundle-rust-crt.mjs') { throw 'not-packaging-only' }
          git show "$($env:PACKAGING_SHA):scripts/bundle-rust-crt.mjs" | Set-Content scripts/bundle-rust-crt.mjs -Encoding utf8
          $receipt = Get-Content rust/target/release/fuze-build-evidence.json -Raw | ConvertFrom-Json
          if (!$receipt.completed -or !$receipt.sourceClean -or $receipt.revision -ne $env:SOURCE_SHA.Substring(0,12)) { throw 'original-build-receipt-mismatch' }
          foreach ($file in $receipt.binaries.PSObject.Properties) {
            if ((Get-FileHash (Join-Path 'rust/target/release' $file.Name)).Hash.ToLowerInvariant() -ne $file.Value) { throw 'original-binary-mismatch' }
          }
          cargo +1.90.0 build --manifest-path rust/Cargo.toml --release --locked -p fuze-worker-host --bin fuze-update-verify -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare public data and self-check preview
        shell: pwsh
        run: |
          node scripts/prepare-rust-data.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-rust-preview.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Include minimum app-local VC runtime and create update package
        shell: pwsh
        run: |
          ./scripts/extract-rust-crt.ps1 -Output (Join-Path $env:RUNNER_TEMP 'fuze-crt')
          $revision = $env:SOURCE_SHA.Substring(0,12)
          node scripts/bundle-rust-crt.mjs "rust/artifacts/preview/fuze-rust-preview-$revision" (Join-Path $env:RUNNER_TEMP 'fuze-crt/dlls')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $env:RUNNER_TEMP 'fuze-release-helpers/finalize-preview.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-rust-update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-rust-update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify 0.7.4 updater can read the new online package
        shell: pwsh
        run: |
          $manifest = Get-Content rust/artifacts/preview/rust-update.json -Raw | ConvertFrom-Json
          & (Join-Path $env:RUNNER_TEMP 'fuze-previous-updater/fuze-update.exe') --verify-package rust/artifacts/preview/rust-update.json (Join-Path 'rust/artifacts/preview' $manifest.archive) (Join-Path $env:RUNNER_TEMP 'fuze-previous-updater/verified-new-payload')
          if ($LASTEXITCODE -ne 0) { throw 'previous-updater-compatibility-failed' }
      - name: Wrap the same payload in unsigned Setup
        shell: pwsh
        run: |
          $revision = $env:SOURCE_SHA.Substring(0,12)
          $output = [IO.Path]::GetFullPath('rust/artifacts/preview')
          $payload = Join-Path $output "fuze-rust-preview-$revision"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DPayload=$payload" "/DOutput=$output" installer/rust-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $output 'FUZE-Setup-0.7.5-windows-x64.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne 'NotSigned') { throw 'unexpected-signature-state' }
          Rename-Item -LiteralPath $exe -NewName "FUZE-Setup-0.7.5-preview-$revision-windows-x64.exe"
      - name: Publish verified files then switch preview manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node (Join-Path $env:RUNNER_TEMP 'fuze-release-helpers/publish-preview.mjs')
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: rust/target
          key: rust-preview-1.90-${{ hashFiles('rust/Cargo.lock', 'rust/ui-lab/Cargo.lock', 'rust/vc-runtime-policy.json') }}-${{ env.SOURCE_SHA }}-resume
      - name: Preserve build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-evidence
          retention-days: 7
          path: |
            rust/target/release/fuze-rust-host.exe
            rust/target/release/fuze-ocr-worker.exe
            rust/target/release/fuze-update.exe
            rust/target/release/fuze-ui-lab.exe
            rust/target/release/fuze-build-evidence.json
            rust/artifacts/update-validation.json
            rust/artifacts/preview/preview-validation.json
            rust/artifacts/preview/build-evidence-*.json
      - name: Update latest stable Release with the same verified payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: node (Join-Path $env:RUNNER_TEMP 'fuze-release-helpers/promote-stable.mjs')
