name: Publish existing FUZE 0.7.2 as stable
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fuze-preview-publication
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify and publish existing packages as latest stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-helpers/promote-stable.mjs
