name: Rust installer bootstrap contracts
on:
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/*rust*setup*'
      - 'tests/unit/rust-setup*'
      - '.github/workflows/rust-installer-contracts.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Installer states, syntax and input boundary
        run: |
          ./tests/unit/rust-setup-bootstrap.ps1
          if (-not $?) { exit 1 }
          node --test tests/unit/rust-setup-input.test.mjs
          exit $LASTEXITCODE
      - name: Compile real wizard with a deliberately invalid non-executable payload
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'setup-contract-payload'
          $output = Join-Path $env:RUNNER_TEMP 'setup-contract-output'
          New-Item -ItemType Directory -Path $fixture,$output | Out-Null
          [IO.File]::WriteAllText((Join-Path $fixture 'build.json'), '{}')
          Copy-Item scripts/install-rust-prerequisites.ps1 (Join-Path $fixture 'Install-local.ps1')
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DPayload=$fixture" "/DOutput=$output" '/DVersion=0.0.0' installer/rust-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appRoot = Join-Path $env:LOCALAPPDATA 'FuzeRustPreview'
          if (Test-Path -LiteralPath $appRoot) { throw 'fixture-existing-user-data' }
          $log = Join-Path $output 'fixture-setup.log'
          $process = Start-Process -FilePath (Join-Path $output 'FUZE-Setup-0.0.0-windows-x64.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$log`"" -WindowStyle Hidden -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(60000)) { throw 'fixture-timeout' }
          $process.Refresh()
          if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath $appRoot)) { throw 'fixture-invalid-payload-was-installed' }
          $text = [IO.File]::ReadAllText($log)
          if ($text -notmatch 'fuze-setup-state-unknown-build' -or $text -notmatch 'FUZE bootstrap exit=5' -or $text -match 'FUZE policy-check exit=') {
            Get-Content -LiteralPath $log -Tail 35
            throw 'fixture-did-not-reach-x64-bootstrap'
          }
          Write-Host 'Real x64 wizard reached bootstrap; invalid payload rejected without installation.'
      - name: Verify extracted native hashes and missing-runtime rejection without executable FUZE
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'setup-contract-payload'
          $output = Join-Path $env:RUNNER_TEMP 'setup-contract-output'
          $names = @('fuze-rust-host.exe','fuze-ocr-worker.exe','fuze-update.exe','fuze-ui-lab.exe','onnxruntime.dll','DirectML.dll','dxcompiler.dll','dxil.dll')
          $hashes = [ordered]@{}
          foreach ($name in $names) {
            Copy-Item -LiteralPath "$env:WINDIR/System32/kernel32.dll" -Destination (Join-Path $fixture $name)
            $hashes[$name] = (Get-FileHash -LiteralPath (Join-Path $fixture $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          # Real x64 PE bytes, deliberately impossible future runtime; no FUZE executable exists.
          $contract = @{
            schema=1; architecture='x64'; minimumVersion='14.65535.65535.65535'
            basis='supported-baseline-not-lowest-abi-version'; compilerVersion='19.44.35229.0'; linkerVersion='14.44.35229.0'
            policySha256=('0' * 64); binaries=$hashes; requiredDlls=@('vcruntime140.dll')
            redistributable=@{version='14.65535.65535.65535';sha256=('0' * 64);url='https://download.visualstudio.microsoft.com/download/pr/fixture/VC_redist.x64.exe'}
          }
          @{revision='0123456789ab';uiFrontend='slint';vcRuntime=$contract} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $fixture 'build.json') -Encoding utf8
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DPayload=$fixture" "/DOutput=$output" '/DVersion=0.0.1' installer/rust-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Join-Path $output 'runtime-fixture.log'
          $process = Start-Process -FilePath (Join-Path $output 'FUZE-Setup-0.0.1-windows-x64.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$log`"" -WindowStyle Hidden -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(60000)) { throw 'runtime-fixture-timeout' }
          $process.Refresh()
          $text = [IO.File]::ReadAllText($log)
          if ($process.ExitCode -eq 0 -or (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'FuzeRustPreview')) -or
              $text -notmatch 'fuze-setup-state-runtime-required' -or $text -notmatch 'FUZE bootstrap exit=3') {
            Get-Content -LiteralPath $log -Tail 35
            throw 'runtime-fixture-extraction-or-contract'
          }
          Write-Host 'Extracted PE hashes verified; missing runtime rejected without installing or launching.'
