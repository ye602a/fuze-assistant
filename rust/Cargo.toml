[workspace]
resolver = "2"
members = ["crates/fuze-contract", "crates/fuze-ocr", "crates/fuze-native-overlay", "crates/fuze-capture", "crates/fuze-runtime", "crates/fuze-worker-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
image = { version = "=0.25.8", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
