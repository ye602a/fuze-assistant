[package]
name = "fuze-ui-lab"
version = "0.1.0"
edition = "2021"
publish = false

# An independent experiment: production workspace and lockfile stay unchanged.
[workspace]
resolver = "2"

[features]
gpu = ["slint/renderer-skia", "dep:i-slint-renderer-skia", "dep:raw-window-handle"]

[dependencies]
# Diagnostic-only access, pinned with Slint; not a production UI contract.
i-slint-common = { version = "=1.13.1", features = ["shared-fontdb"] }
i-slint-renderer-skia = { version = "=1.13.1", optional = true, features = ["opengl"] }
raw-window-handle = { version = "=0.6.2", optional = true }
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "accessibility", "unstable-winit-030"] }
windows-numerics = "=0.2.0"
serde_json = "=1.0.145"
image = { version = "=0.25.8", default-features = false, features = ["png"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build = "=1.13.1"

[profile.release]
strip = true
