[package]
name = "fuze-lcu"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
fuze-runtime = { path = "../fuze-runtime" }
serde_json.workspace = true
serde.workspace = true
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Rpc", "Win32_UI_Shell"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Security_Cryptography"] }
