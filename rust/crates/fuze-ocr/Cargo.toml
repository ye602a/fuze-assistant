[package]
name = "fuze-ocr"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fuze-contract = { path = "../fuze-contract" }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

[target.'cfg(windows)'.dependencies]
fuze-capture = { path = "../fuze-capture" }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Threading"] }
