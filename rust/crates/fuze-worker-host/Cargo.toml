[package]
name = "fuze-worker-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fuze-contract = { path = "../fuze-contract" }
fuze-data = { path = "../fuze-data" }
fuze-runtime = { path = "../fuze-runtime" }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
flate2 = "=1.1.10"

[target.'cfg(windows)'.dependencies]
fuze-lcu = { path = "../fuze-lcu" }
fuze-native-overlay = { path = "../fuze-native-overlay" }
fuze-capture = { path = "../fuze-capture" }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_Xps", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
