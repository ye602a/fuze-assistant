<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">从已选海克斯到下一次选择</title><desc id="desc">自动确认已选海克斯，下一次选择时查找对应搭配数据。有数据就显示两符文搭配胜率与场次，没有则保留单符文统计。</desc>
<rect width="1120" height="350" rx="12" fill="#091722"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="45" fill="#d6bd79" font-size="16">搭配参考 · 示意</text>
<text x="32" y="88" fill="#f0eee6" font-size="28" font-weight="bold">上一张选了什么，下一张就有搭配可查。</text>
<g fill="#102633" stroke="#385362"><rect x="32" y="124" width="302" height="150" rx="6"/><rect x="409" y="124" width="302" height="150" rx="6"/><rect x="786" y="124" width="302" height="150" rx="6"/></g>
<g fill="#6bd6d1" font-size="15"><text x="54" y="154">01 / 自动记录</text><text x="431" y="154">02 / 对应搭配</text><text x="808" y="154">03 / 直接看参考</text></g>
<g fill="#f0eee6" font-size="23" font-weight="bold"><text x="54" y="197">你已选中的海克斯</text><text x="431" y="197">已选 + 当前候选</text><text x="808" y="197">搭配胜率 · 场次</text></g>
<g fill="#b3c2cb" font-size="16"><text x="54" y="237">无需手动勾选或弹窗确认</text><text x="431" y="237">查询来源中的真实组合记录</text><text x="808" y="237">与单符文统计分开展示</text></g>
<g fill="#d6bd79" font-size="32"><text x="355" y="208">→</text><text x="732" y="208">→</text></g>
<text x="32" y="319" fill="#b3c2cb" font-size="16">没有对应搭配数据时，继续显示单符文统计。不会把两张卡的胜率拼算成一个结果。</text>
</g></svg>